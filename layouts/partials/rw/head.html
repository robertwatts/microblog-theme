<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFD23F">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ with .Title }}{{ . }} – {{ end }}{{ site.Title }}{{ end }}</title>
  {{- with (partialCached "rw/about-page.html" . "about").lede }}<meta name="description" content="{{ trim (. | plainify | htmlUnescape) " \n" }}">{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap">
  {{- /* micro.blog's head also links custom.css and plug-in CSS (rw.css); drop its favicon (an old photo from micro.blog) for ours */}}
  {{ partial "microblog_head.html" . | replaceRE `<link rel="shortcut icon"[^>]*>` "" | safeHTML }}
  <link rel="icon" href="{{ "favicon-32.png" | relURL }}" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
</head>
