<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFD23F">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ with .Title }}{{ . }} – {{ end }}{{ site.Title }}{{ end }}</title>
  {{- with site.Params.rw_intro }}<meta name="description" content="{{ . | plainify }}">{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap">
  {{- range site.Params.plugins_css }}
  <link rel="stylesheet" href="{{ . }}">
  {{- end }}
  {{ partial "microblog_head.html" . }}
</head>
